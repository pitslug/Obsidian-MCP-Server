services:

# Obsidian MCP - reads the LiveSync vault straight from CouchDB and serves it over MCP
  obsidian-mcp:
    container_name: obsidian-mcp
    # Built and published by .github/workflows/docker-publish.yml, same as
    # onenote-mcp. Comment `image:` and uncomment `build:` to build locally
    # from a checkout instead.
    #
    # Pinned to :0.1 rather than :edge, which is whatever is on main: this
    # service holds transcripts that nothing can recompute, which is the
    # stack's own reason for pinning stateful services. The tag moves as 0.1.x
    # releases are tagged, so a `docker compose pull` is what deploys one.
    image: ghcr.io/pitslug/obsidian-mcp-server:0.1
    # build:
    #   context: $OBSIDIAN_MCP_SRC            # checkout of pitslug/Obsidian-MCP-Server
    #   dockerfile: Dockerfile
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - docker_net
    ports:
      - "$OBSIDIAN_MCP_PORT:8080"
    volumes:
      # Holds the replica and index (both derived, safe to destroy) alongside
      # transcripts.sqlite, which is NOT derived: nothing can recompute a
      # transcription of a handwritten page. $DATADIR is what the nightly
      # backup captures, which is why it lives here and not in a scratch path.
      - $DATADIR/obsidian-mcp:/data
    secrets:
      - obsidian_mcp_couchdb_password
      # - obsidian_mcp_bearer_token           # only for AUTH_MODE=bearer; OAuth needs no secret here
      # - obsidian_mcp_e2ee_passphrase        # only once E2EE is enabled on the vault
    env_file:
      - $ENVDIR/obsidian-mcp.env
    environment:
      TZ: $TZ
      COUCHDB_PASSWORD_FILE: /run/secrets/obsidian_mcp_couchdb_password
      # MCP_BEARER_TOKEN_FILE: /run/secrets/obsidian_mcp_bearer_token
      # E2EE_PASSPHRASE_FILE: /run/secrets/obsidian_mcp_e2ee_passphrase
    user: "$PUID:$PGID"                       # the image has no PUID/PGID entrypoint; set the uid directly
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 1m
      timeout: 10s
      retries: 2
      start_period: 60s                       # first start replicates the whole vault
    labels:
      - "traefik.enable=true"
      ## HTTP Routers
      - "traefik.http.routers.obsidian-mcp-rtr.entrypoints=websecure"
      - "traefik.http.routers.obsidian-mcp-rtr.rule=Host(`obsidian-mcp.$DOMAINNAME`)"
      ## Middlewares
      # chain-no-auth, because this service authenticates its own callers: it is
      # an OAuth 2.1 resource server, and it accepts only tokens Pocket-ID
      # issued for this service specifically. traefik-forward-auth in front
      # would break it, since an MCP client cannot complete an interactive
      # browser login for a forward-auth cookie. Same reason Nextcloud and
      # Immich sit on this chain.
      #
      # /health and /.well-known/oauth-protected-resource are deliberately
      # unauthenticated: the healthcheck needs the first, and a client cannot
      # discover where to authenticate without the second.
      - "traefik.http.routers.obsidian-mcp-rtr.middlewares=chain-no-auth@file"
      ## HTTP Services
      - "traefik.http.routers.obsidian-mcp-rtr.service=obsidian-mcp-svc"
      - "traefik.http.services.obsidian-mcp-svc.loadbalancer.server.port=8080"

secrets:
  obsidian_mcp_couchdb_password:
    file: $SECRETSDIR/obsidian_mcp_couchdb_password
  # obsidian_mcp_bearer_token:
  #   file: $SECRETSDIR/obsidian_mcp_bearer_token
  # obsidian_mcp_e2ee_passphrase:
  #   file: $SECRETSDIR/obsidian_mcp_e2ee_passphrase

networks:
  docker_net:
    external: true
